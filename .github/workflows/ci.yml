name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: native
            target: x86_64-unknown-linux-gnu
            runner: ""
          - name: aarch64-via-qemu
            target: aarch64-unknown-linux-gnu
            runner: qemu-aarch64
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        if: matrix.name == 'native'
        run: cargo fmt --all --check

      - name: Clippy
        if: matrix.name == 'native'
        run: cargo clippy --all-targets -- -D warnings

      - name: Install emulator
        if: matrix.runner != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-user

      - name: Unit, CLI, and end-to-end tests
        env:
          RUSK_E2E_TARGET: ${{ matrix.name == 'native' && 'x86_64' || 'aarch64' }}
          RUSK_E2E_RUNNER: ${{ matrix.runner }}
        run: cargo test --all-targets --verbose

      - name: Check example programs
        if: matrix.name == 'native'
        run: |
          cargo run --quiet -- check examples/hello.rk
          cargo run --quiet -- check examples/lists.rk
          cargo run --quiet -- check examples/closures.rk
